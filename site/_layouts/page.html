---
layout: default
bodyClass: "page-basic"
---
{% include lang.html %}
{%- assign page_texts = t[page.key] -%}
{%- assign readme_url = site.repository_url | append: "#readme" -%}
<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
  <div class="row justify-content-start">
    <div class="col-12{% unless page.wide %} col-lg-9{% endunless %}">
      <h1 class="title">{{ page_texts.title }}</h1>
      <p class="lead">{{ page_texts.lead | replace: "%readme%", readme_url }}</p>
      <div class="content">{{ content }}</div>
    </div>
  </div>
</div>
