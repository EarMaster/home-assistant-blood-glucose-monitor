<div class="footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="footer-inner">
          <h2 class="footer-title">{{ site.title }}</h2>
          <ul>
            {% assign footermenu = site.data.menus.main | sort: 'weight' %}
            {% for item in footermenu %}
            <li><a href="{{ item.url | relative_url }}">{{ item.name }}</a></li>
            {% endfor %}
            <li><a href="{{ site.repository_url }}">GitHub</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
