acknowledge:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: blood_glucose_monitor
    alarm:
      required: false
      selector:
        select:
          translation_key: alarm
          options:
            - urgent_low
            - low
            - high
            - urgent_high
            - rapid_fall
            - rapid_rise
            - data_loss
            - charging
