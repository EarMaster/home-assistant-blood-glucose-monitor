name: Validate

on:
  push:
    # main is validated by the release workflow.
    branches-ignore: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    name: Marketplace (HACS) validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
