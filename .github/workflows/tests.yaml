name: Tests

on:
  push:
    # main is tested by the release workflow.
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      all:
        description: Run every job, whatever changed.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Without a base (schedule, manual run, call from the release) all runs.
      - id: changes
        env:
          BASE: ${{ !inputs.all && (github.event.pull_request.base.sha || github.event.before) || '' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changes.py --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  tests:
    name: Lint and tests
    # Skipped jobs count as passed for the required checks of main.
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov --cov-report=term-missing

  release-source:
    name: Release source
    # Releases come from develop only; required by the main ruleset.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - if: github.head_ref != 'develop'
        run: |
          echo "::error::Pull requests into main must come from develop (got ${{ github.head_ref }})."
          exit 1
      - run: echo "Release from develop"

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Pull requests into main are releases: the version has to grow. A pull
      # request that changes nothing of the integration is a docs update and
      # may keep the version (no tag, no release).
      - run: python scripts/check_version.py ${{ github.base_ref == 'main' && format('--release --base origin/{0}', github.base_ref) || '' }}
